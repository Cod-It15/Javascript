<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Calculator (Excercise)</title>
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Ojuju:wght@200..800&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .pagecontent {
        height: 100vh;
        background-color: #000000;
        height: 100vh;
        width: 100vw;
    }

    .content {
        text-align: center;
        font-family: ojuju, cursive;
        width: 100vw;
        background-color: #00eeff;
        color: black;
        border: 0px transparent;
        border-radius: 5px;
        height: 56px;
        margin-bottom: 20px;
        margin-top: 0px;
    }

    .screen {
        margin: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        /* margin: auto; */
        width: 94vw;
        height: 10vh;
        background-color: #000000;
    }

    .screen-bar {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: auto;
        min-width: 68vw;
        height: 15vh;
        padding: 5px;
        width: fit-content;
        background-color: #000000;
        color: rgb(22, 22, 22);
        font-size: 3em;
        font-weight: 800;
        border: 1px solid #ffffff;
        border-radius: 5px;
    }

    .buttons {
        justify-content: center;
        width: 60vw;
        margin: 60px 0px 10px 0px;
        display: grid;
        gap: 3px;
        grid-template-columns: repeat(4, 1fr);
        /* grid code  */
        grid-template-rows: repeat(4, 1fr);
    }
    .blu-bg{
        background-color: #00eeff !important;
        font-weight:700;
        font-size: 30px !important; 
    }

    .calc-button {
        color: #000;
        /* Black background */
        background-color: #fff;
        /* White text */
        border: none;
        padding: 20px;
        font-size: 18px;
        cursor: pointer;
        text-align: center;
        border-radius: 5px;
    }

    .calc-button:hover {
        background-color: #8b8b8b;
        /* Slightly lighter black for hover effect */
        transform: scale(1.1);
        /* Slightly increase the size on hover */
        transition: transform 0.3s ease-in-out;
    }

    .screen-text {
        width: fit-content;
        display: flex;
        justify-content: right;
        text-align: center;
    }

    .calc {
        /* width: 80vw; */
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .A-value {
        padding: 10px 16px 10px 16px;
        color: #00eeff;
        font-size: 20px;
        font-family: consolas, sans-serif;
        font-style: normal;
        font-weight: 400;
        font-size: 16px;
        line-height: 19px;
        text-align: right;

    }

    .Q-value {
        padding-right: 16px;
        color: #00eeff;
        font-size: 20px;
        font-family: consolas, sans-serif;
        font-style: normal;
        font-weight: 400;
        font-size: 16px;
        line-height: 19px;
        text-align: right;
    }
</style>

<body>
    <script src="script.js"></script>
    <div class="pagecontent">
        <main class="content">
            <h1>Calculator</h1>
            <section class="screen">
                <div class="screen-bar">
                    <span id="screentext">
                        <p class="Q-value" id="question">wef</p>
                        <p class="A-value" id="answer"></p>
                    </span>
                </div>
            </section>

            <div class="calc">
                <section class="buttons">
                    <input type="button" class="calc-button seven" value="7" id="7">
                    <input type="button" class="calc-button eight" value="8" id="8">
                    <input type="button" class="calc-button nine" value="9" id="9">
                    <input type="button" class="calc-button clear" onclick="clear()" value="C" id="clear">
                    <input type="button" class="calc-button four" value="4" id="4">
                    <input type="button" class="calc-button five" value="5" id="5">
                    <input type="button" class="calc-button six" value="6" id="6">
                    <input type="button" class="calc-button plus" value="+" id="plus">
                    <input type="button" class="calc-button one" value="1" id="1">
                    <input type="button" class="calc-button two" value="2" id="2">
                    <input type="button" class="calc-button three" value="3" id="3">
                    <input type="button" class="calc-button minus" value="-" id="minus">
                    <input type="button" class="calc-button multiply" value="*" id="multiply">
                    <input type="button" class="calc-button zero" value="0" id="0">
                    <input type="button" class="calc-button divide" value="/" id="divide">
                    <input type="button" class="calc-button blu-bg ans" value="=" id="ans">
                </section>
            </div>
        </main>
    </div>
</body>

</html>
